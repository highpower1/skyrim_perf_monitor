[Settings]
; Number of warmup frames to skip initially (to ignore loading screens and startup spikes)
WarmupFrames = 100

; Buffer size before waking up background thread to flush batched metrics to disk
FlushInterval = 1000

; Log Working Set RAM usage in Megabytes (1 = Enabled, 0 = Disabled)
LogRAM = 1

; Log active high-priority actor (NPC) count in the player's vicinity (1 = Enabled, 0 = Disabled)
LogHighActors = 1

; Name of the output CSV file created under "My Games/Skyrim Special Edition/SKSE/"
OutputFileName = skyrim_perf_log.csv
